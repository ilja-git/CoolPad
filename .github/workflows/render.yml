name: Render

on:
  push:
  pull_request:
  workflow_dispatch:
    # Optional one-off overrides. Leave blank to use the defaults baked
    # into src/coolpad.scad.
    inputs:
      length:
        description: "length (mm, X)"
        required: false
        default: ""
      width:
        description: "width (mm, Y)"
        required: false
        default: ""
      height:
        description: "height (mm, Z, shell only)"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # xvfb because OpenSCAD needs a display to write a PNG. tools/build.sh
      # picks it up automatically when DISPLAY is unset.
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad xvfb
          openscad --version

      # The system python on the runner is externally managed, so pip cannot
      # install into it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install USDZ toolchain
        run: pip install --quiet usd-core numpy-stl

      - name: Collect -D overrides
        id: params
        env:
          IN_LENGTH: ${{ inputs.length }}
          IN_WIDTH: ${{ inputs.width }}
          IN_HEIGHT: ${{ inputs.height }}
        run: |
          args=""
          for name in length width height; do
            var="IN_$(echo "$name" | tr '[:lower:]' '[:upper:]')"
            value="${!var}"
            if [ -z "$value" ]; then continue; fi
            # Numbers only - these end up on a command line.
            case "$value" in
              ''|*[!0-9.]*) echo "::error::$name must be a number, got '$value'"; exit 1 ;;
            esac
            args="$args -D $name=$value"
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "Overrides:${args:- (none, using file defaults)}"

      # Everything is in tools/build.sh so that a local build and a CI build
      # are the same build: the same manifold gate, the same camera angles,
      # the same USDZ checks. Add build steps there, not here.
      - name: Build
        env:
          ARGS: ${{ steps.params.outputs.args }}
        # shellcheck disable=SC2086  # $ARGS is deliberately word-split
        run: tools/build.sh $ARGS

      - name: Summarise
        # Cosmetic only - never let it block the artifact upload.
        continue-on-error: true
        env:
          ARGS: ${{ steps.params.outputs.args }}
        run: |
          python3 tools/summarise.py --out out --intake build/intake.txt \
            --overrides "$ARGS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coolpad-${{ github.sha }}
          path: out/
          if-no-files-found: error
